# Note: You must restart bin/shakapacker-dev-server for changes to take effect

default: &default
  source_path: app/javascript
  source_entry_path: packs
  public_root_path: public
  public_output_path: packs
  cache_path: tmp/cache/webpacker
  webpack_compile_output: true

  # Additional paths webpack should lookup modules
  # ['app/assets', 'engine/foo/app/assets']
  # NOTE: do NOT add vendor/javascript/cozy-sun-bear (or any subdirectory of it)
  # here. Shakapacker feeds these paths into webpack's `resolve.modules`, which
  # is for node-module-style bare specifier resolution, not arbitrary source
  # watching. Adding cozy-sun-bear/src caused bare `import ... from 'epubjs'`
  # to incorrectly resolve to the local src/epubjs.js file instead of the real
  # npm epubjs package.
  additional_paths: ['app/assets']

  # Reload manifest.json on all requests so we reload latest compiled packs
  cache_manifest: false

  # Use babel as the JavaScript transpiler (keeps existing Babel setup)
  javascript_transpiler: "babel"

  # Extract and emit a css file
  extract_css: false

  static_assets_extensions:
    - .jpg
    - .jpeg
    - .png
    - .gif
    - .tiff
    - .ico
    - .svg
    - .eot
    - .otf
    - .ttf
    - .woff
    - .woff2

  extensions:
    - .mjs
    - .js
    - .sass
    - .scss
    - .css
    - .module.sass
    - .module.scss
    - .module.css
    - .png
    - .svg
    - .gif
    - .jpeg
    - .jpg

development:
  <<: *default
  compile: true
  extract_css: true

  # Reference: https://webpack.js.org/configuration/dev-server/
  dev_server:
    # webpack-dev-server 5.x removed the boolean `https` option in favor of
    # `server`. Leaving the old `https: false` key here causes webpack-cli's
    # schema validation to throw and the dev server process to exit
    # immediately on startup (silently, unless you check the log/port).
    server: http
    host: localhost
    port: 3035
    public: localhost:3035
    hmr: false
    # Inline should be set to true if using HMR
    inline: true
    # ResizeObserver loop notifications are browser runtime warnings, not
    # compile failures; do not let them cover the EPUB reader.
    client:
      overlay:
        runtimeErrors: false
    compress: true
    disable_host_check: true
    use_local_ip: false
    quiet: false
    pretty: false
    headers:
      'Access-Control-Allow-Origin': '*'
    watch_options:
      # Ignore everything in node_modules EXCEPT the vendored, symlinked
      # cozy-sun-bear package. Because package.json links cozy-sun-bear via
      # `link:vendor/javascript/cozy-sun-bear`, webpack resolves its files
      # through node_modules/cozy-sun-bear. A blanket `**/node_modules/**`
      # ignore therefore also ignored our own vendored source, so edits to
      # e.g. scss/cozy.scss weren't picked up until an empty-cache hard reload
      # forced an on-demand recompile. This negated glob keeps that package
      # watched while still ignoring the rest of node_modules.
      ignored: '**/node_modules/!(cozy-sun-bear)/**'


test:
  <<: *default
  compile: true

  # Compile test packs to a separate directory
  public_output_path: packs-test

production:
  <<: *default

  # Production depends on precompilation of packs prior to booting for performance.
  compile: false

  # Extract and emit a css file
  extract_css: true

  # Cache manifest.json for performance
  cache_manifest: true
